name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm smoke:pack
      - name: Verify release tag matches package versions
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            for (const name of ["core", "codegen", "cli", "react"]) {
              const { version } = JSON.parse(readFileSync(`packages/${name}/package.json`, "utf8"));
              if (version !== tagVersion) {
                throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} does not match @nexapi/${name}@${version}`);
              }
            }
          '
      - name: Publish packages
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
