name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Verify package archives
        run: pnpm smoke:pack

      - name: Verify release tag matches package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const tagVersion = process.env.RELEASE_TAG.replace(/^v/, "");

            for (const name of ["core", "codegen", "cli", "react"]) {
              const path = `packages/${name}/package.json`;
              const { name: packageName, version } =
                JSON.parse(readFileSync(path, "utf8"));

              if (version !== tagVersion) {
                throw new Error(
                  `Release tag does not match ${packageName}@${version}`
                );
              }

              console.log(`Verified ${packageName}@${version}`);
            }
          '

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish workspace packages
        run: pnpm --filter "./packages/**" -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
